name: Update Trackmania leaderboard

on:
  schedule:
    - cron: "0 */3 * * *"   # toutes les 3 heures
  workflow_dispatch: {}       # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch leaderboard
        run: python fetch_leaderboard.py

      - name: Commit updated leaderboard
        run: |
          git config user.name "tm-duel-bot"
          git config user.email "actions@github.com"
          git add leaderboard.json
          git diff --quiet --cached || git commit -m "Update leaderboard [skip ci]"
          git push
